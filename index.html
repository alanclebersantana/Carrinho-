<!-- ============================================================
     CONFIGURAÇÃO DO FIREBASE
     Entrada com e-mail e senha + escala sincronizada no Firestore.

     Como preencher (uma vez só):
     1) console.firebase.google.com → crie um projeto.
     2) Criação → Authentication → Sign-in method → ative "E-mail/senha".
     3) Criação → Firestore Database → criar banco (modo produção) e
        cole as regras que estão no README.md.
     4) Configurações do projeto → Seus apps → Web (</>) → registre o app
        e copie os valores do firebaseConfig para os campos abaixo.

     Enquanto os campos estiverem com "COLE_AQUI", o app funciona
     normalmente, só que salvando apenas neste aparelho.
     ============================================================ -->
<script>
  window.FIREBASE_CONFIG = {
    apiKey: "COLE_AQUI_A_API_KEY",
    authDomain: "COLE_AQUI.firebaseapp.com",
    projectId: "COLE_AQUI_O_PROJECT_ID",
    storageBucket: "COLE_AQUI.firebasestorage.app",
    messagingSenderId: "COLE_AQUI",
    appId: "COLE_AQUI"
  };
</script>
</head>
<body>

<div class="app-shell" id="app"></div>

<script defer src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
